<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ELOP </title>
  <meta name="description" content="Mapa interativo da atividade ELOP, com cinco bases na Escola Superior de Sargentos.">
  <meta name="theme-color" content="#f4efe6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f4efe6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e23d2b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="pular" href="#titulo-mapa">Ir para o mapa</a>

  <header class="topo">
    <div>
      <div class="titulo-linha">
        <h1 id="nome">ELOP</h1>
        <img class="logo" src="logo-essgt.png" alt="Brasão da Escola Superior de Sargentos">
      </div>
      <p class="lead" id="lead">Toque em cada base para ver a tarefa.</p>
    </div>
  </header>

  <main class="layout">
    <section class="mapa-secao" aria-labelledby="titulo-mapa">
      <div class="mapa-topo">
        <h2 id="titulo-mapa"></h2>
        <p id="status"></p>
      </div>
      <p class="mapa-dica">Toque em uma letra para abrir a base.</p>
      <div class="mapa-viewport">
        <svg id="mapa" class="mapa" viewBox="0 0 1024 768" aria-labelledby="mapa-titulo">
          <title id="mapa-titulo">Mapa da Escola Superior de Sargentos</title>
          <image id="foto" href="mapa-local.jpg" x="0" y="0" width="1024" height="780" preserveAspectRatio="xMinYMin slice"/>

          <g id="zonas"></g>
          <g id="pins"></g>
          <g id="seta-pino" class="seta-pino" aria-hidden="true"></g>
        </svg>
        <div id="dica-pino" class="dica-pino" hidden></div>
      </div>
      <section class="equipes-bloco" aria-label="Agenda das Equipes">
        <h2 class="equipes-titulo">Agenda das Equipes</h2>
        <nav class="equipes">
          <button type="button" class="equipe" data-equipe="01" aria-label="Equipe 01">01</button>
          <button type="button" class="equipe" data-equipe="02" aria-label="Equipe 02">02</button>
          <button type="button" class="equipe" data-equipe="03" aria-label="Equipe 03">03</button>
          <button type="button" class="equipe" data-equipe="04" aria-label="Equipe 04">04</button>
          <button type="button" class="equipe" data-equipe="05" aria-label="Equipe 05">05</button>
          <button type="button" class="equipe" data-equipe="06" aria-label="Equipe 06">06</button>
        </nav>
      </section>
    </section>
  </main>

  <footer class="rodape">
    <p>Desenvolvedor Al Sgt PM Murilo</p>
  </footer>

  <div id="popup" class="popup" hidden>
    <button type="button" class="popup-fundo" id="popup-fundo" aria-label="Fechar"></button>
    <aside class="diretorio" id="diretorio" role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
      <button type="button" class="popup-fechar" id="fechar">Fechar</button>
      <article id="painel" class="painel" aria-label="Detalhe da base selecionada">
        <h3 id="painel-titulo">Base</h3>
        <p class="resumo">Carregando o mapa…</p>
      </article>
    </aside>
  </div>

  <div id="popup-equipe" class="popup" hidden>
    <button type="button" class="popup-fundo" id="popup-equipe-fundo" aria-label="Fechar"></button>
    <aside class="diretorio calendario" id="calendario" role="dialog" aria-modal="true" aria-labelledby="equipe-titulo">
      <button type="button" class="popup-fechar" id="fechar-equipe">Fechar</button>
      <article class="painel painel-equipe" aria-label="Agenda da equipe">
        <p class="painel-kicker">Agenda</p>
        <h3 id="equipe-titulo">Equipe</h3>
        <p id="equipe-composicao" class="equipe-composicao"></p>
        <ol id="agenda-lista" class="agenda-lista"></ol>
      </article>
    </aside>
  </div>

  <noscript>
    <p class="sem-js">Ative o JavaScript para usar o mapa interativo.</p>
  </noscript>

  <script src="dados.js?v=20261028c"></script>
  <script src="app.js?v=20261028c"></script>
</body>
</html>
